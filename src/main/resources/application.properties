spring.application.name=EstatePro
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
estatepro.jwt.secret=${JWT_SECRET:estatepro-local-development-only-secret-change-before-deployment}
estatepro.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
estatepro.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:8080}
estatepro.demo.password=${DEMO_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
